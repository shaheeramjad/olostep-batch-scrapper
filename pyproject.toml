[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "olostep-batch-scraper"
version = "0.1.0"
description = "Scrape thousands of pages to Markdown in minutes with Olostep Maps + Batches."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "olostep>=1.2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.urls]
Repository = "https://github.com/shaheeramjad/olostep-batch-scrapper"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
olostep-batch-scraper = "olostep_batch_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olostep_batch_scraper"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["output*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:olostep.*"]
